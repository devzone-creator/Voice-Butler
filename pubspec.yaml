name: voice_butler
description: An intelligent voice-activated task management application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  provider: ^6.1.1
  
  # Local Storage
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # Voice Input
  speech_to_text: ^6.6.0
  permission_handler: ^11.1.0
  
  # AI Integration
  http: ^1.1.0
  google_generative_ai: ^0.2.2
  
  # Background Jobs & Notifications
  workmanager: ^0.5.2
  flutter_local_notifications: ^16.3.0
  timezone: ^0.9.4
  
  # UI & Navigation
  go_router: ^12.1.3
  flutter_animate: ^4.3.0
  
  # Utilities
  uuid: ^4.2.1
  intl: ^0.19.0
  equatable: ^2.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  
  # Testing
  mockito: ^5.4.4
  build_runner: ^2.4.7
  test: ^1.24.9

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
